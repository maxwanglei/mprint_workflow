[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mprint-drug-dictionaries"
version = "0.1.0"
description = "Combine local drug vocabulary releases into reusable CSV tables and an exact-name DuckDB database."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
mprint-prepare = "mprint_workflow.prepare_dictionaries:main"

[tool.hatch.build.targets.sdist]
include = ["/*.py", "/pyproject.toml", "/README.md", "/FORMATS.md", "/LICENSE", "/NOTICE", "/sources.example.yaml", "/demo", "/colab", "/docs/colab-google-drive.md"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel]
include = ["/*.py", "/demo", "/sources.example.yaml", "/FORMATS.md"]
exclude = ["/test_*.py", "/conftest.py", "**/__pycache__"]
sources = {"" = "mprint_workflow"}

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [".venv", "build", "dist", "data", "demo", "raw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
